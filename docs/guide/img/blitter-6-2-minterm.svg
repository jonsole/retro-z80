<text x="324" y="238" font-size="11" text-anchor="start" fill="#555">Each column is one region of the circles: the column's</text>
<text x="324" y="253" font-size="11" text-anchor="start" fill="#555">A, B and C bits say which circles it is inside.</text>
<text x="324" y="275" font-size="11" text-anchor="start" fill="#555">Shaded: the regions where A ? B : C (0xCA) gives 1.</text>
<text x="324" y="290" font-size="11" text-anchor="start" fill="#555">(0xF0 &amp; 0xCC) | (~0xF0 &amp; 0xAA) = 0xC0 | 0x0A = 0xCA</text>
