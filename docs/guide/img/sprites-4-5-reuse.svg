<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">
  <rect x="0" y="0" width="760" height="465" fill="#ffffff"/>
  <text x="428.08" y="20" text-anchor="middle">beam pixels</text>
  <line x1="130" y1="34" x2="130" y2="42" stroke="#777"/>
  <text x="130" y="31" text-anchor="middle" font-size="11" fill="#555">0</text>
  <line x1="229.36" y1="34" x2="229.36" y2="42" stroke="#777"/>
  <text x="229.36" y="31" text-anchor="middle" font-size="11" fill="#555">144</text>
  <line x1="726.16" y1="34" x2="726.16" y2="42" stroke="#777"/>
  <text x="726.16" y="31" text-anchor="middle" font-size="11" fill="#555">864</text>
  <rect x="130" y="50" width="99.36" height="28" fill="#d9d9d9" stroke="#333"/>
  <rect x="229.36" y="50" width="496.8" height="28" fill="#cfe2f3" stroke="#333"/>
  <text x="122" y="63" text-anchor="end">line E − 1</text>
  <rect x="130" y="110" width="99.36" height="28" fill="#d9d9d9" stroke="#333"/>
  <rect x="229.36" y="110" width="496.8" height="28" fill="#cfe2f3" stroke="#333"/>
  <text x="122" y="123" text-anchor="end">line E</text>
  <text x="122" y="137" text-anchor="end" font-size="11" fill="#555">the old use's last line</text>
  <rect x="130" y="190" width="99.36" height="28" fill="#d9d9d9" stroke="#333"/>
  <rect x="229.36" y="190" width="496.8" height="28" fill="#cfe2f3" stroke="#333"/>
  <text x="122" y="203" text-anchor="end">line E + 1</text>
  <text x="122" y="217" text-anchor="end" font-size="11" fill="#555">the gap line</text>
  <rect x="130" y="300" width="99.36" height="28" fill="#d9d9d9" stroke="#333"/>
  <rect x="229.36" y="300" width="496.8" height="28" fill="#cfe2f3" stroke="#333"/>
  <text x="122" y="313" text-anchor="end">line E + 2</text>
  <text x="122" y="327" text-anchor="end" font-size="11" fill="#555">the new use's first line</text>
  <rect x="130" y="360" width="99.36" height="28" fill="#d9d9d9" stroke="#333"/>
  <rect x="229.36" y="360" width="496.8" height="28" fill="#cfe2f3" stroke="#333"/>
  <text x="122" y="373" text-anchor="end">line E + 3</text>
  <rect x="367.36" y="54" width="44.16" height="20" fill="#d5a6bd" stroke="#333"/>
  <text x="389.44" y="68" text-anchor="middle" font-size="11">old use</text>
  <rect x="367.36" y="114" width="44.16" height="20" fill="#d5a6bd" stroke="#333"/>
  <text x="389.44" y="128" text-anchor="middle" font-size="11">old use</text>
  <rect x="488.8" y="304" width="44.16" height="20" fill="#d5a6bd" stroke="#333"/>
  <text x="510.88" y="318" text-anchor="middle" font-size="11">new use</text>
  <rect x="488.8" y="364" width="44.16" height="20" fill="#d5a6bd" stroke="#333"/>
  <text x="510.88" y="378" text-anchor="middle" font-size="11">new use</text>
  <rect x="130" y="194" width="20.7" height="20" fill="#ffe599" stroke="#333"/>
  <line x1="150.7" y1="186" x2="150.7" y2="222" stroke="#333" stroke-width="2"/>
  <line x1="141.04" y1="160" x2="141.04" y2="194" stroke="#777"/>
  <text x="147.04" y="154" font-size="11">copper: CWAIT (E + 1, 0), then 12 MOVEs (H, V, PT, CTL): CTL lands about 30 pixels later at PRI 1</text>
  <line x1="141.04" y1="230" x2="706.84" y2="230" stroke="#777"/>
  <line x1="141.04" y1="225" x2="141.04" y2="235" stroke="#777"/>
  <line x1="706.84" y1="225" x2="706.84" y2="235" stroke="#777"/>
  <rect x="295.6" y="223" width="262.2" height="14" fill="#ffffff"/>
  <text x="426.7" y="234" text-anchor="middle" font-size="11">or the sequencer: its writes land in pixels 16–836</text>
  <rect x="709.6" y="190" width="5.52" height="28" fill="#f4b183" stroke="#333"/>
  <line x1="712.36" y1="218" x2="712.36" y2="252" stroke="#777"/>
  <text x="712.36" y="265" text-anchor="end" font-size="11">840–847: line E + 2's sizes are worked out from H, V and STEP</text>
  <text x="20" y="427">Old use: VSTOP = E + 1. A CTL write in line E + 1 starts the sprite again; its first line is the next</text>
  <text x="20" y="447">line inside its window. So the new use can start on line E + 2 or later: new VSTART ≥ old VSTOP + 1.</text>
</svg>
