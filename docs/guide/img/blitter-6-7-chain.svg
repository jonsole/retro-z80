<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777"/></marker></defs>
<rect width="760" height="400" fill="#ffffff"/>
<text x="20" y="22" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">A chain of descriptors (Example 6-2): restore, save, draw</text>
<rect x="30" y="48" width="170" height="52" fill="#ffe599" stroke="#333" stroke-width="1"/>
<text x="40" y="66" font-size="11" text-anchor="start" fill="#555">channel 2</text>
<text x="40" y="88" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">CHDESC = restore</text>
<text x="214" y="70" font-size="11" text-anchor="start" fill="#1a1a1a">then START</text>
<text x="214" y="84" font-size="11" text-anchor="start" fill="#1a1a1a">in CHCTRL</text>
<line x1="90" y1="100" x2="90" y2="118" stroke="#777" stroke-width="1" marker-end="url(#ah)"/>
<text x="20" y="132" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">restore:</text>
<text x="242" y="132" font-size="11" text-anchor="end" fill="#555">32 bytes</text>
<rect x="20" y="140" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="156" font-size="11" text-anchor="start" fill="#555">+0x00</text>
<text x="68" y="156" font-size="11" text-anchor="start" fill="#1a1a1a">CTRL</text>
<text x="126" y="156" font-size="11" text-anchor="start" fill="#1a1a1a">BLIT, BPP8</text>
<rect x="20" y="164" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="180" font-size="11" text-anchor="start" fill="#555">+0x03</text>
<text x="68" y="180" font-size="11" text-anchor="start" fill="#1a1a1a">MINTERM</text>
<text x="126" y="180" font-size="11" text-anchor="start" fill="#1a1a1a">0xCC</text>
<rect x="20" y="188" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="204" font-size="11" text-anchor="start" fill="#555">+0x04</text>
<text x="68" y="204" font-size="11" text-anchor="start" fill="#1a1a1a">APT</text>
<text x="126" y="204" font-size="11" text-anchor="start" fill="#1a1a1a">0</text>
<rect x="20" y="212" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="228" font-size="11" text-anchor="start" fill="#555">+0x07</text>
<text x="68" y="228" font-size="11" text-anchor="start" fill="#1a1a1a">BPT</text>
<text x="126" y="228" font-size="11" text-anchor="start" fill="#1a1a1a">SAVE</text>
<rect x="20" y="236" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="252" font-size="11" text-anchor="start" fill="#555">+0x0A</text>
<text x="68" y="252" font-size="11" text-anchor="start" fill="#1a1a1a">DPT</text>
<text x="126" y="252" font-size="11" text-anchor="start" fill="#1a1a1a">oldpos</text>
<rect x="20" y="260" width="222" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="25" y="276" font-size="11" text-anchor="start" fill="#555">+0x0D</text>
<text x="68" y="276" font-size="11" text-anchor="start" fill="#1a1a1a">WIDTH … VALUE</text>
<rect x="20" y="284" width="222" height="24" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="25" y="300" font-size="11" text-anchor="start" fill="#555">+0x1C</text>
<text x="68" y="300" font-size="11" text-anchor="start" fill="#1a1a1a">NEXT</text>
<text x="126" y="300" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">save</text>
<rect x="20" y="140" width="222" height="168" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="242" y1="296" x2="260" y2="296" stroke="#777" stroke-width="1"/>
<line x1="260" y1="296" x2="260" y2="110" stroke="#777" stroke-width="1"/>
<line x1="260" y1="110" x2="299" y2="110" stroke="#777" stroke-width="1"/>
<line x1="299" y1="110" x2="299" y2="118" stroke="#777" stroke-width="1" marker-end="url(#ah)"/>
<text x="269" y="132" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">save:</text>
<text x="491" y="132" font-size="11" text-anchor="end" fill="#555">32 bytes</text>
<rect x="269" y="140" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="156" font-size="11" text-anchor="start" fill="#555">+0x00</text>
<text x="317" y="156" font-size="11" text-anchor="start" fill="#1a1a1a">CTRL</text>
<text x="375" y="156" font-size="11" text-anchor="start" fill="#1a1a1a">BLIT, BPP8</text>
<rect x="269" y="164" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="180" font-size="11" text-anchor="start" fill="#555">+0x03</text>
<text x="317" y="180" font-size="11" text-anchor="start" fill="#1a1a1a">MINTERM</text>
<text x="375" y="180" font-size="11" text-anchor="start" fill="#1a1a1a">0xCC</text>
<rect x="269" y="188" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="204" font-size="11" text-anchor="start" fill="#555">+0x04</text>
<text x="317" y="204" font-size="11" text-anchor="start" fill="#1a1a1a">APT</text>
<text x="375" y="204" font-size="11" text-anchor="start" fill="#1a1a1a">0</text>
<rect x="269" y="212" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="228" font-size="11" text-anchor="start" fill="#555">+0x07</text>
<text x="317" y="228" font-size="11" text-anchor="start" fill="#1a1a1a">BPT</text>
<text x="375" y="228" font-size="11" text-anchor="start" fill="#1a1a1a">newpos</text>
<rect x="269" y="236" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="252" font-size="11" text-anchor="start" fill="#555">+0x0A</text>
<text x="317" y="252" font-size="11" text-anchor="start" fill="#1a1a1a">DPT</text>
<text x="375" y="252" font-size="11" text-anchor="start" fill="#1a1a1a">SAVE</text>
<rect x="269" y="260" width="222" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="274" y="276" font-size="11" text-anchor="start" fill="#555">+0x0D</text>
<text x="317" y="276" font-size="11" text-anchor="start" fill="#1a1a1a">WIDTH … VALUE</text>
<rect x="269" y="284" width="222" height="24" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="274" y="300" font-size="11" text-anchor="start" fill="#555">+0x1C</text>
<text x="317" y="300" font-size="11" text-anchor="start" fill="#1a1a1a">NEXT</text>
<text x="375" y="300" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">draw</text>
<rect x="269" y="140" width="222" height="168" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="491" y1="296" x2="509" y2="296" stroke="#777" stroke-width="1"/>
<line x1="509" y1="296" x2="509" y2="110" stroke="#777" stroke-width="1"/>
<line x1="509" y1="110" x2="548" y2="110" stroke="#777" stroke-width="1"/>
<line x1="548" y1="110" x2="548" y2="118" stroke="#777" stroke-width="1" marker-end="url(#ah)"/>
<text x="518" y="132" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">draw:</text>
<text x="740" y="132" font-size="11" text-anchor="end" fill="#555">32 bytes</text>
<rect x="518" y="140" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="156" font-size="11" text-anchor="start" fill="#555">+0x00</text>
<text x="566" y="156" font-size="11" text-anchor="start" fill="#1a1a1a">CTRL</text>
<text x="624" y="156" font-size="11" text-anchor="start" fill="#1a1a1a">BLIT, BPP8|MASKKEY</text>
<rect x="518" y="164" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="180" font-size="11" text-anchor="start" fill="#555">+0x03</text>
<text x="566" y="180" font-size="11" text-anchor="start" fill="#1a1a1a">MINTERM</text>
<text x="624" y="180" font-size="11" text-anchor="start" fill="#1a1a1a">0xCA</text>
<rect x="518" y="188" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="204" font-size="11" text-anchor="start" fill="#555">+0x04</text>
<text x="566" y="204" font-size="11" text-anchor="start" fill="#1a1a1a">APT</text>
<text x="624" y="204" font-size="11" text-anchor="start" fill="#1a1a1a">0</text>
<rect x="518" y="212" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="228" font-size="11" text-anchor="start" fill="#555">+0x07</text>
<text x="566" y="228" font-size="11" text-anchor="start" fill="#1a1a1a">BPT</text>
<text x="624" y="228" font-size="11" text-anchor="start" fill="#1a1a1a">ball</text>
<rect x="518" y="236" width="222" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="252" font-size="11" text-anchor="start" fill="#555">+0x0A</text>
<text x="566" y="252" font-size="11" text-anchor="start" fill="#1a1a1a">DPT</text>
<text x="624" y="252" font-size="11" text-anchor="start" fill="#1a1a1a">newpos</text>
<rect x="518" y="260" width="222" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="523" y="276" font-size="11" text-anchor="start" fill="#555">+0x0D</text>
<text x="566" y="276" font-size="11" text-anchor="start" fill="#1a1a1a">WIDTH … VALUE</text>
<rect x="518" y="284" width="222" height="24" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="523" y="300" font-size="11" text-anchor="start" fill="#555">+0x1C</text>
<text x="566" y="300" font-size="11" text-anchor="start" fill="#1a1a1a">NEXT</text>
<text x="624" y="300" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">0</text>
<rect x="518" y="140" width="222" height="168" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="518" y="334" font-size="13" text-anchor="start" fill="#1a1a1a">NEXT = 0: the end.</text>
<text x="518" y="351" font-size="11" text-anchor="start" fill="#555">DONE sets, BUSY clears</text>
<text x="30" y="334" font-size="11" text-anchor="start" fill="#555">Each descriptor is 32 bytes at a multiple of 4 in SRAM;</text>
<text x="30" y="349" font-size="11" text-anchor="start" fill="#555">loading one costs 16 memory reads.</text>
<text x="30" y="371" font-size="11" text-anchor="start" fill="#555">The channel loads each into its job registers, runs it,</text>
<text x="30" y="386" font-size="11" text-anchor="start" fill="#555">then loads the one at NEXT.</text>
</svg>
