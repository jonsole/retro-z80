<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777"/></marker></defs>
<rect width="760" height="370" fill="#ffffff"/>
<text x="20" y="22" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">A window narrower than the picture: the stride is still the picture's</text>
<rect x="40" y="50" width="320" height="130" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<rect x="80" y="70" width="160" height="80" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="160" y="114" font-size="12" text-anchor="middle" fill="#1a1a1a">shown</text>
<text x="200" y="44" font-size="11" text-anchor="middle" fill="#1a1a1a">the picture: 640 pixels at 1 bpp = 80 bytes a line</text>
<text x="200" y="196" font-size="11" text-anchor="middle" fill="#555">the window shows 320 of them</text>
<text x="400" y="54" font-size="11" text-anchor="start" fill="#1a1a1a">in memory, line after line:</text>
<rect x="400" y="70" width="17" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<rect x="417" y="70" width="136" height="24" fill="#f4b183" stroke="#333" stroke-width="1"/>
<rect x="553" y="70" width="119" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="394" y="86" font-size="11" text-anchor="end" fill="#1a1a1a">y</text>
<rect x="400" y="104" width="17" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<rect x="417" y="104" width="136" height="24" fill="#f4b183" stroke="#333" stroke-width="1"/>
<rect x="553" y="104" width="119" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="394" y="120" font-size="11" text-anchor="end" fill="#1a1a1a">y+1</text>
<rect x="400" y="138" width="17" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<rect x="417" y="138" width="136" height="24" fill="#f4b183" stroke="#333" stroke-width="1"/>
<rect x="553" y="138" width="119" height="24" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="394" y="154" font-size="11" text-anchor="end" fill="#1a1a1a">y+2</text>
<line x1="400" y1="182" x2="672" y2="182" stroke="#777" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<text x="536" y="195" font-size="11" text-anchor="middle" fill="#555">BPLSTRIDE = 80 bytes</text>
<text x="400" y="216" font-size="11" text-anchor="start" fill="#555">next line's start = this line's start + BPLSTRIDE,</text>
<text x="400" y="230" font-size="11" text-anchor="start" fill="#555">whatever the window width, scale or fine scroll</text>
<text x="20" y="281" font-size="11" text-anchor="start" fill="#1a1a1a">One line: the pointer walks through the shown part, then jumps by BPLSTRIDE from the line's start</text>
<rect x="40" y="295" width="40" height="26" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<rect x="80" y="295" width="320" height="26" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="240" y="312" font-size="11" text-anchor="middle" fill="#1a1a1a">fetched: the pointer + 2 per word</text>
<rect x="400" y="295" width="280" height="26" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="540" y="312" font-size="11" text-anchor="middle" fill="#1a1a1a">not fetched</text>
<rect x="680" y="295" width="80" height="26" fill="#f3f3f3" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
<text x="720" y="312" font-size="11" text-anchor="middle" fill="#1a1a1a">line y+1 …</text>
<line x1="80" y1="335" x2="720" y2="335" stroke="#777" stroke-width="1" marker-end="url(#ah)"/>
<text x="80" y="349" font-size="10" text-anchor="start" fill="#555">start of line y (saved at the first fetch)</text>
<text x="720" y="349" font-size="10" text-anchor="end" fill="#555">start of line y+1</text>
</svg>
