<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
<text x="20" y="22" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">A chain of descriptors (Example 6-2): restore, save, draw</text>
<rect x="30" y="48" width="170" height="52" fill="#ffe599" stroke="#333" stroke-width="1"/>
<text x="40" y="66" font-size="11" text-anchor="start" fill="#555">the blitter</text>
<text x="40" y="88" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">BLTDESC = restore</text>
<text x="214" y="70" font-size="11" text-anchor="start" fill="#1a1a1a">then START</text>
<text x="214" y="84" font-size="11" text-anchor="start" fill="#1a1a1a">in BLTCMD</text>
<line x1="90" y1="100" x2="90" y2="118" stroke="#777" stroke-width="1" marker-end="url(#ah)"/>
<text x="20" y="132" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">restore:</text>
<text x="242" y="132" font-size="11" text-anchor="end" fill="#555">32 bytes</text>
<rect x="20" y="140" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="158" font-size="11" text-anchor="start" fill="#555">+0x00</text>
<text x="68" y="158" font-size="11" text-anchor="start" fill="#1a1a1a">BLTCTRL</text>
<text x="132" y="158" font-size="11" text-anchor="start" fill="#1a1a1a">0xCC, 8 bpp</text>
<rect x="20" y="168" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="186" font-size="11" text-anchor="start" fill="#555">+0x04</text>
<text x="68" y="186" font-size="11" text-anchor="start" fill="#1a1a1a">BLTBPT</text>
<text x="132" y="186" font-size="11" text-anchor="start" fill="#1a1a1a">SAVE</text>
<rect x="20" y="196" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="25" y="214" font-size="11" text-anchor="start" fill="#555">+0x08</text>
<text x="68" y="214" font-size="11" text-anchor="start" fill="#1a1a1a">BLTDPT</text>
<text x="132" y="214" font-size="11" text-anchor="start" fill="#1a1a1a">oldpos</text>
<rect x="20" y="224" width="222" height="28" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="25" y="242" font-size="11" text-anchor="start" fill="#555">+0x0C</text>
<text x="68" y="242" font-size="11" text-anchor="start" fill="#1a1a1a">SIZE … VALUE</text>
<rect x="20" y="252" width="222" height="28" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="25" y="270" font-size="11" text-anchor="start" fill="#555">+0x1C</text>
<text x="68" y="270" font-size="11" text-anchor="start" fill="#1a1a1a">BLTNEXT</text>
<text x="132" y="270" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">save</text>
<rect x="20" y="140" width="222" height="140" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="242" y1="266" x2="260" y2="266" stroke="#777" stroke-width="1"/>
<line x1="260" y1="266" x2="260" y2="110" stroke="#777" stroke-width="1"/>
<line x1="260" y1="110" x2="299" y2="110" stroke="#777" stroke-width="1"/>
<line x1="299" y1="110" x2="299" y2="118" stroke="#777" stroke-width="1" marker-end="url(#ah)"/>
<text x="269" y="132" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">save:</text>
<text x="491" y="132" font-size="11" text-anchor="end" fill="#555">32 bytes</text>
<rect x="269" y="140" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="158" font-size="11" text-anchor="start" fill="#555">+0x00</text>
<text x="317" y="158" font-size="11" text-anchor="start" fill="#1a1a1a">BLTCTRL</text>
<text x="381" y="158" font-size="11" text-anchor="start" fill="#1a1a1a">0xCC, 8 bpp</text>
<rect x="269" y="168" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="186" font-size="11" text-anchor="start" fill="#555">+0x04</text>
<text x="317" y="186" font-size="11" text-anchor="start" fill="#1a1a1a">BLTBPT</text>
<text x="381" y="186" font-size="11" text-anchor="start" fill="#1a1a1a">newpos1</text>
<rect x="269" y="196" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="274" y="214" font-size="11" text-anchor="start" fill="#555">+0x08</text>
<text x="317" y="214" font-size="11" text-anchor="start" fill="#1a1a1a">BLTDPT</text>
<text x="381" y="214" font-size="11" text-anchor="start" fill="#1a1a1a">SAVE</text>
<rect x="269" y="224" width="222" height="28" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="274" y="242" font-size="11" text-anchor="start" fill="#555">+0x0C</text>
<text x="317" y="242" font-size="11" text-anchor="start" fill="#1a1a1a">SIZE … VALUE</text>
<rect x="269" y="252" width="222" height="28" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="274" y="270" font-size="11" text-anchor="start" fill="#555">+0x1C</text>
<text x="317" y="270" font-size="11" text-anchor="start" fill="#1a1a1a">BLTNEXT</text>
<text x="381" y="270" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">draw</text>
<rect x="269" y="140" width="222" height="140" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="491" y1="266" x2="509" y2="266" stroke="#777" stroke-width="1"/>
<line x1="509" y1="266" x2="509" y2="110" stroke="#777" stroke-width="1"/>
<line x1="509" y1="110" x2="548" y2="110" stroke="#777" stroke-width="1"/>
<line x1="548" y1="110" x2="548" y2="118" stroke="#777" stroke-width="1" marker-end="url(#ah)"/>
<text x="518" y="132" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">draw:</text>
<text x="740" y="132" font-size="11" text-anchor="end" fill="#555">32 bytes</text>
<rect x="518" y="140" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="158" font-size="11" text-anchor="start" fill="#555">+0x00</text>
<text x="566" y="158" font-size="11" text-anchor="start" fill="#1a1a1a">BLTCTRL</text>
<text x="630" y="158" font-size="11" text-anchor="start" fill="#1a1a1a">0xCA, MASKKEY</text>
<rect x="518" y="168" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="186" font-size="11" text-anchor="start" fill="#555">+0x04</text>
<text x="566" y="186" font-size="11" text-anchor="start" fill="#1a1a1a">BLTBPT</text>
<text x="630" y="186" font-size="11" text-anchor="start" fill="#1a1a1a">ball</text>
<rect x="518" y="196" width="222" height="28" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="523" y="214" font-size="11" text-anchor="start" fill="#555">+0x08</text>
<text x="566" y="214" font-size="11" text-anchor="start" fill="#1a1a1a">BLTDPT</text>
<text x="630" y="214" font-size="11" text-anchor="start" fill="#1a1a1a">newpos2</text>
<rect x="518" y="224" width="222" height="28" fill="#f3f3f3" stroke="#333" stroke-width="1"/>
<text x="523" y="242" font-size="11" text-anchor="start" fill="#555">+0x0C</text>
<text x="566" y="242" font-size="11" text-anchor="start" fill="#1a1a1a">SIZE … VALUE</text>
<rect x="518" y="252" width="222" height="28" fill="#f4b183" stroke="#333" stroke-width="1"/>
<text x="523" y="270" font-size="11" text-anchor="start" fill="#555">+0x1C</text>
<text x="566" y="270" font-size="11" text-anchor="start" fill="#1a1a1a">BLTNEXT</text>
<text x="630" y="270" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">0</text>
<rect x="518" y="140" width="222" height="140" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="518" y="310" font-size="13" text-anchor="start" fill="#1a1a1a">BLTNEXT = 0: the end.</text>
<text x="518" y="327" font-size="11" text-anchor="start" fill="#555">BUSY clears, DMXINT.BLT sets</text>
<text x="30" y="310" font-size="11" text-anchor="start" fill="#555">Each descriptor is 32 bytes at an even address in SRAM;</text>
<text x="30" y="325" font-size="11" text-anchor="start" fill="#555">loading one costs 16 memory reads.</text>
<text x="30" y="347" font-size="11" text-anchor="start" fill="#555">The blitter loads each into its job registers, runs it,</text>
<text x="30" y="362" font-size="11" text-anchor="start" fill="#555">then loads the one at BLTNEXT.</text>
</svg>
