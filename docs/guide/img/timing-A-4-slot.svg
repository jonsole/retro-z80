<text x="532" y="48" font-size="10" text-anchor="start" fill="#555">4</text>
<line x1="565" y1="52" x2="565" y2="62" stroke="#777" stroke-width="1"/>
<text x="567" y="48" font-size="10" text-anchor="start" fill="#555">5</text>
<line x1="600" y1="52" x2="600" y2="62" stroke="#777" stroke-width="1"/>
<text x="602" y="48" font-size="10" text-anchor="start" fill="#555">6</text>
