<text x="637" y="48" font-size="10" text-anchor="start" fill="#555">7</text>
<line x1="670" y1="52" x2="670" y2="62" stroke="#777" stroke-width="1"/>
<text x="672" y="48" font-size="10" text-anchor="start" fill="#555">8</text>
<line x1="705" y1="52" x2="705" y2="62" stroke="#777" stroke-width="1"/>
<text x="707" y="48" font-size="10" text-anchor="start" fill="#555">9</text>
<line x1="740" y1="52" x2="740" y2="62" stroke="#777" stroke-width="1"/>
<line x1="40" y1="74" x2="390" y2="74" stroke="#777" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<text x="215" y="87" font-size="11" text-anchor="middle" fill="#555">slot k: edges 0-9, 100 ns</text>
<line x1="390" y1="74" x2="740" y2="74" stroke="#777" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ahs)"/>
