<text x="145" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">1 display</text>
<rect x="180" y="98" width="70" height="30" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="215" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">2 CPU</text>
<rect x="250" y="98" width="70" height="30" fill="#f9cb9c" stroke="#333" stroke-width="1"/>
<text x="285" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">3 display</text>
<rect x="320" y="98" width="70" height="30" fill="#ffe599" stroke="#333" stroke-width="1"/>
<text x="355" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">4 pool</text>
<rect x="390" y="98" width="70" height="30" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="425" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">0 CPU</text>
<rect x="460" y="98" width="70" height="30" fill="#f9cb9c" stroke="#333" stroke-width="1"/>
<text x="495" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">1 display</text>
<rect x="530" y="98" width="70" height="30" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="565" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">2 CPU</text>
<rect x="600" y="98" width="70" height="30" fill="#f9cb9c" stroke="#333" stroke-width="1"/>
<text x="635" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">3 display</text>
<rect x="670" y="98" width="70" height="30" fill="#ffe599" stroke="#333" stroke-width="1"/>
<text x="705" y="117" font-size="11" text-anchor="middle" fill="#1a1a1a">4 pool</text>
<text x="40" y="144" font-size="11" text-anchor="start" fill="#555">memory cycle k is issued at slot edge 2k (0, 20, 40, 60, 80 ns); its data is usable 40 ns later</text>
<rect x="40" y="162" width="175" height="26" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="127.5" y="179" font-size="11" text-anchor="middle" fill="#1a1a1a">T-state (0-50 ns)</text>
<rect x="215" y="162" width="175" height="26" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="302.5" y="179" font-size="11" text-anchor="middle" fill="#1a1a1a">T-state (50-100 ns)</text>
<rect x="390" y="162" width="175" height="26" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="477.5" y="179" font-size="11" text-anchor="middle" fill="#1a1a1a">T-state (100-150 ns)</text>
<rect x="565" y="162" width="175" height="26" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="652.5" y="179" font-size="11" text-anchor="middle" fill="#1a1a1a">T-state (150-200 ns)</text>
<text x="40" y="204" font-size="11" text-anchor="start" fill="#555">at 20 MHz every T-state starts on slot edge 0 or 5</text>
<text x="40" y="234" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold">Read, T1 on edge 0: uses cycle 2</text>
<rect x="40" y="240" width="350" height="22" fill="#eef5ea" stroke="#333" stroke-width="1"/>
<text x="44" y="255" font-size="11" text-anchor="start" fill="#1a1a1a">T1</text>
<text x="219" y="255" font-size="11" text-anchor="start" fill="#1a1a1a">T2</text>
<rect x="180" y="268" width="70" height="18" fill="#b6d7a8" stroke="#333" stroke-width="2"/>
<text x="215" y="281" font-size="10" text-anchor="middle" fill="#1a1a1a">read</text>
<line x1="40" y1="296" x2="40" y2="304" stroke="#333" stroke-width="1"/>
<text x="40" y="317" font-size="10" text-anchor="middle" fill="#1a1a1a">address</text>
<line x1="320" y1="296" x2="320" y2="304" stroke="#333" stroke-width="1"/>
<text x="320" y="317" font-size="10" text-anchor="middle" fill="#1a1a1a">byte at di</text>
<line x1="390" y1="240" x2="390" y2="304" stroke="#333" stroke-width="2"/>
<text x="394" y="317" font-size="10" text-anchor="start" fill="#1a1a1a">core takes it</text>
<line x1="320" y1="292" x2="390" y2="292" stroke="#777" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<text x="355" y="288" font-size="10" text-anchor="middle" fill="#555">20 ns spare</text>
<text x="40" y="346" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold">Read, T1 on edge 5: uses cycle 0 of the next slot</text>
<rect x="215" y="352" width="350" height="22" fill="#eef5ea" stroke="#333" stroke-width="1"/>
<text x="219" y="367" font-size="11" text-anchor="start" fill="#1a1a1a">T1</text>
<text x="394" y="367" font-size="11" text-anchor="start" fill="#1a1a1a">T2</text>
<rect x="390" y="380" width="70" height="18" fill="#b6d7a8" stroke="#333" stroke-width="2"/>
<text x="425" y="393" font-size="10" text-anchor="middle" fill="#1a1a1a">read</text>
<line x1="215" y1="408" x2="215" y2="416" stroke="#333" stroke-width="1"/>
<text x="215" y="429" font-size="10" text-anchor="middle" fill="#1a1a1a">address</text>
<line x1="530" y1="408" x2="530" y2="416" stroke="#333" stroke-width="1"/>
<text x="530" y="429" font-size="10" text-anchor="middle" fill="#1a1a1a">byte at di</text>
<line x1="565" y1="352" x2="565" y2="416" stroke="#333" stroke-width="2"/>
<text x="569" y="429" font-size="10" text-anchor="start" fill="#1a1a1a">core takes it</text>
<line x1="530" y1="404" x2="565" y2="404" stroke="#777" stroke-width="1" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<text x="547.5" y="400" font-size="10" text-anchor="middle" fill="#555">10 ns spare</text>
