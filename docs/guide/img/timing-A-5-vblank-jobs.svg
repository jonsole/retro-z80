<svg xmlns="http://www.w3.org/2000/svg" width="760" height="398" viewBox="0 0 760 398" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777"/></marker></defs>
<rect width="760" height="398" fill="#ffffff"/>
<text x="20" y="24" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">What fits in the vertical blank (31,360 T-states, 1.57 ms, at 20 MHz)</text>
<rect x="300" y="44" width="400" height="278" fill="none" stroke="#777" stroke-width="1" stroke-dasharray="4 3"/>
<text x="292" y="66" font-size="12" text-anchor="end" fill="#1a1a1a">Set up a layer from a 32-byte table (LDIR)</text>
<rect x="300" y="50" width="8.51" height="22" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="314.51" y="66" font-size="11" text-anchor="start" fill="#1a1a1a">667 T, 2%</text>
<text x="292" y="100" font-size="12" text-anchor="end" fill="#1a1a1a">Load 16 colours (LDIR, 48 bytes)</text>
<rect x="300" y="84" width="12.79" height="22" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="318.79" y="100" font-size="11" text-anchor="start" fill="#1a1a1a">1,003 T, 3%</text>
<text x="292" y="134" font-size="12" text-anchor="end" fill="#1a1a1a">Load 256 colours (unrolled LDI, 768 bytes)</text>
<rect x="300" y="118" width="156.73" height="22" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="462.73" y="134" font-size="11" text-anchor="start" fill="#1a1a1a">12,288 T, 39%</text>
<text x="292" y="168" font-size="12" text-anchor="end" fill="#1a1a1a">Load 256 colours (OUTI loop)</text>
<rect x="300" y="152" width="248.16" height="22" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="542.16" y="168" font-size="11" text-anchor="end" fill="#1a1a1a">19,456 T, 62%</text>
<text x="292" y="202" font-size="12" text-anchor="end" fill="#1a1a1a">Copy 1 KB with LDIR</text>
<rect x="300" y="186" width="274.22" height="22" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="568.22" y="202" font-size="11" text-anchor="end" fill="#1a1a1a">21,499 T, 69%</text>
<text x="292" y="236" font-size="12" text-anchor="end" fill="#1a1a1a">Clear 8 KB with unrolled PUSH</text>
<rect x="300" y="220" width="440" height="22" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<polygon points="740,220 750,231 740,242" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="694" y="236" font-size="11" text-anchor="end" fill="#1a1a1a">45,056 T, 144%: does not fit</text>
<text x="292" y="270" font-size="12" text-anchor="end" fill="#1a1a1a">DMA engine: copy 1 KB (about 45 MB/s)</text>
<rect x="300" y="254" width="5.87" height="22" fill="#ffe599" stroke="#333" stroke-width="1"/>
<text x="311.87" y="270" font-size="11" text-anchor="start" fill="#1a1a1a">about 23 µs, 1.5%</text>
<text x="292" y="304" font-size="12" text-anchor="end" fill="#1a1a1a">DMA engine: clear 8 KB (about 89 MB/s)</text>
<rect x="300" y="288" width="23.47" height="22" fill="#ffe599" stroke="#333" stroke-width="1"/>
<text x="329.47" y="304" font-size="11" text-anchor="start" fill="#1a1a1a">about 92 µs, 6%</text>
<line x1="300" y1="324" x2="300" y2="330" stroke="#777" stroke-width="1"/>
<text x="300" y="343" font-size="11" text-anchor="start" fill="#555">0</text>
<line x1="500" y1="324" x2="500" y2="330" stroke="#777" stroke-width="1"/>
<text x="500" y="343" font-size="11" text-anchor="middle" fill="#555">15,680</text>
<line x1="700" y1="324" x2="700" y2="330" stroke="#777" stroke-width="1"/>
<text x="700" y="343" font-size="11" text-anchor="end" fill="#555">31,360 T</text>
<rect x="20" y="354" width="12" height="12" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
<text x="36" y="364" font-size="11" text-anchor="start" fill="#1a1a1a">the Z80</text>
<rect x="100" y="354" width="12" height="12" fill="#ffe599" stroke="#333" stroke-width="1"/>
<text x="116" y="364" font-size="11" text-anchor="start" fill="#1a1a1a">the DMA engine (the Z80 carries on meanwhile)</text>
</svg>
