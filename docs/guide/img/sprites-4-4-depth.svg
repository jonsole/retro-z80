  <polygon points="94,195 116,182 116,207 94,220" fill="#d5a6bd" stroke="#333"/>
  <text x="102" y="294" text-anchor="middle">Sprites</text>
  <text x="102" y="310" text-anchor="middle" font-size="11" fill="#555">DEPTH 0</text>
  <text x="102" y="56" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="176" y="294" text-anchor="middle">PRI tiles</text>
  <text x="176" y="310" text-anchor="middle" font-size="11" fill="#555">any layer</text>
  <text x="176" y="56" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="250" y="294" text-anchor="middle">FRONT</text>
  <text x="250" y="310" text-anchor="middle" font-size="11" fill="#555">layer</text>
  <text x="250" y="56" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="324" y="294" text-anchor="middle">Sprites</text>
  <text x="324" y="310" text-anchor="middle" font-size="11" fill="#555">DEPTH 1</text>
  <text x="324" y="56" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="398" y="294" text-anchor="middle">MIDDLE</text>
  <text x="398" y="310" text-anchor="middle" font-size="11" fill="#555">layer</text>
  <text x="398" y="56" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="472" y="294" text-anchor="middle">Sprites</text>
  <text x="472" y="310" text-anchor="middle" font-size="11" fill="#555">DEPTH 2</text>
  <text x="472" y="56" text-anchor="middle" font-size="11" fill="#555">6</text>
  <text x="546" y="294" text-anchor="middle">BACK</text>
  <text x="546" y="310" text-anchor="middle" font-size="11" fill="#555">layer</text>
  <text x="546" y="56" text-anchor="middle" font-size="11" fill="#555">7</text>
  <text x="620" y="294" text-anchor="middle">Sprites</text>
  <text x="620" y="310" text-anchor="middle" font-size="11" fill="#555">DEPTH 3</text>
  <text x="620" y="56" text-anchor="middle" font-size="11" fill="#555">8</text>
  <text x="694" y="294" text-anchor="middle">BGCOLOR</text>
  <text x="694" y="56" text-anchor="middle" font-size="11" fill="#555">9</text>
  <text x="20" y="28" font-size="15" font-weight="bold">From the front</text>
  <text x="740" y="28" font-size="15" font-weight="bold" text-anchor="end">to the back</text>
  <line x1="30" y1="170" x2="718" y2="170" stroke="#777" stroke-dasharray="4 3"/>
  <polygon points="30,170 40,165 40,175" fill="#777"/>
  <text x="26" y="160" font-size="11" fill="#555">eye</text>
  <text x="20" y="348">With PRIO = L1 in front, then L0, then L2: FRONT is L1, MIDDLE is L0, BACK is L2.</text>
  <text x="20" y="368">Each pixel shows the first opaque source, looking from the front. Among sprites at the same DEPTH,</text>
  <text x="20" y="388">the lower-numbered sprite is in front.</text>
