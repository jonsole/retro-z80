<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#777"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="20" y="22" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">The octant bits for a line from the centre, screen coordinates (y grows down)</text>
<line x1="50" y1="250" x2="444" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="240" y1="60" x2="240" y2="454" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
